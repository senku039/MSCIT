<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Naming Test</title>
  <link rel="stylesheet" href="/theme.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: url('/IMAGES/kids.jpg') no-repeat center center/cover; font-family: Arial, sans-serif; padding: 20px; }
    .container { max-width: min(1200px, 96vw); background: rgba(255,255,255,.96); padding: clamp(20px, 2.4vw, 38px); border-radius: 16px; box-shadow: 0 14px 30px rgba(0,0,0,.18); }
    .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin:16px 0; }
    .tile { border:1px solid #d6e2ff; background:#f7faff; padding:12px; text-align:center; border-radius:8px; font-weight:700; font-size:1.1rem; }
  </style>
</head>
<body>
  <button class="global-back-btn" type="button" onclick="window.location.href='index.html'">← Back</button>
  <div class="container">
    <h1 class="text-center mb-3">Rapid Naming Test (High Priority)</h1>
    <p class="text-muted">Complete only <strong>2 levels</strong>: one for <strong>letters</strong> and one for <strong>words</strong>.</p>
    <div class="d-flex justify-content-between align-items-center">
      <div id="roundInfo" class="fw-semibold text-primary">Level 1 / 2 — Letters</div>
      <small class="text-muted">Type the items in order using spaces or commas</small>
    </div>

    <div id="viewer" class="viewer">Press <strong>Start Level</strong> to begin.</div>

    <button id="startBtn" class="btn btn-primary w-100">Start Level</button>
    <textarea id="answer" class="form-control mt-3" rows="3" placeholder="Example: A B C D ... or CAT,DOG,SUN,..."></textarea>
    <button id="submitBtn" class="btn btn-success w-100 mt-2" disabled>Submit Level</button>

    <div id="result" class="mt-3"></div>
    <button id="finishTestBtn" class="btn btn-info w-100 mt-3" style="display:none;">Finish Test</button>
  </div>

  <script>
    const GRID_ROWS = 4;
    const GRID_COLS = 4;
    const ITEMS_PER_LEVEL = GRID_ROWS * GRID_COLS;

    const LETTER_POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const WORD_POOL = ['cat', 'dog', 'sun', 'book', 'apple', 'water', 'paper', 'happy', 'music', 'flower', 'table', 'garden'];

    const LEVELS = [
      {
        name: 'Level 1 / 2 — Letters',
        helper: 'Type all 16 letters in order (left-to-right, top-to-bottom). Use spaces or commas.',
        buildItems: () => Array.from({ length: ITEMS_PER_LEVEL }, () => LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)])
      },
      {
        name: 'Level 2 / 2 — Mixed Letters + Words',
        helper: 'Type all 16 items in order. This level mixes letters and words.',
        buildItems: () => {
          const mixed = [];
          for (let i = 0; i < ITEMS_PER_LEVEL; i += 1) {
            if (i % 2 === 0) mixed.push(LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)]);
            else mixed.push(WORD_POOL[Math.floor(Math.random() * WORD_POOL.length)]);
          }
          for (let i = mixed.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
          }
          return mixed;
        }
      }
    ];

    let currentLevelIndex = 0;
    let levelStartTime = null;
    let levelTimer = null;
    let activeItems = [];
    const levelResults = [];

    function tokenizeAnswer(text) {
      return text
        .trim()
        .toUpperCase()
        .split(/[\s,|;]+/)
        .map((token) => token.trim())
        .filter(Boolean);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const tenths = Math.floor((seconds - Math.floor(seconds)) * 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
    }

    function renderCurrentLevel() {
      const level = LEVELS[currentLevelIndex];
      activeItems = level.buildItems();

      document.getElementById('roundInfo').textContent = level.name;
      document.querySelector('.text-muted').textContent = level.helper;
      document.getElementById('viewer').innerHTML = `
        <div class="grid" style="grid-template-columns: repeat(${GRID_COLS}, 1fr);">
          ${activeItems.map((item) => `<div class="tile">${item.toUpperCase()}</div>`).join('')}
        </div>`;
    }

    function startLevel() {
      renderCurrentLevel();
      levelStartTime = Date.now();

      const startBtn = document.getElementById('startBtn');
      const submitBtn = document.getElementById('submitBtn');
      const answerEl = document.getElementById('answer');

      startBtn.disabled = true;
      submitBtn.disabled = false;
      answerEl.disabled = false;
      answerEl.value = '';
      answerEl.focus();
      document.getElementById('result').innerHTML = '<span class="text-primary">Timer started. Type the displayed items in order, then click <strong>Submit Level</strong>.</span>';

      if (levelTimer) clearInterval(levelTimer);
      levelTimer = setInterval(() => {
        const elapsed = (Date.now() - levelStartTime) / 1000;
        document.getElementById('roundInfo').textContent = `${LEVELS[currentLevelIndex].name} • Time: ${formatTime(elapsed)}`;
      }, 100);
    }

    function scoreCurrentLevel() {
      if (!levelStartTime) return;

      const elapsedSeconds = Math.max((Date.now() - levelStartTime) / 1000, 1);
      const typedTokens = tokenizeAnswer(document.getElementById('answer').value);
      const expected = activeItems.map((item) => item.toUpperCase());

      let correctInPosition = 0;
      for (let i = 0; i < expected.length; i += 1) {
        if ((typedTokens[i] || '') === expected[i]) correctInPosition += 1;
      }

      const accuracy = (correctInPosition / expected.length) * 100;
      levelResults.push({ elapsedSeconds, accuracy, correctInPosition, total: expected.length });

      if (levelTimer) {
        clearInterval(levelTimer);
        levelTimer = null;
      }

      document.getElementById('result').innerHTML = `
        <div class="alert alert-info">
          <strong>${LEVELS[currentLevelIndex].name} complete.</strong><br>
          Time: ${elapsedSeconds.toFixed(2)} sec<br>
          Accuracy: ${accuracy.toFixed(2)}% (${correctInPosition}/${expected.length})
        </div>`;

      currentLevelIndex += 1;
      levelStartTime = null;

      const submitBtn = document.getElementById('submitBtn');
      const startBtn = document.getElementById('startBtn');
      const answerEl = document.getElementById('answer');

      submitBtn.disabled = true;
      answerEl.disabled = true;

      if (currentLevelIndex < LEVELS.length) {
        startBtn.disabled = false;
        startBtn.textContent = 'Start Next Level';
        document.getElementById('viewer').innerHTML = 'Click <strong>Start Next Level</strong> to continue.';
      } else {
        startBtn.disabled = true;
        submitBtn.style.display = 'none';
        renderFinalSummary();
      }
    }

    function renderFinalSummary() {
      const totalTime = levelResults.reduce((sum, item) => sum + item.elapsedSeconds, 0);
      const avgAccuracy = levelResults.reduce((sum, item) => sum + item.accuracy, 0) / Math.max(levelResults.length, 1);
      const itemsPerMinute = ((ITEMS_PER_LEVEL * LEVELS.length) / Math.max(totalTime, 1)) * 60;
      const speedScore = Math.min((itemsPerMinute / 120) * 100, 100);
      const finalScore = Math.max(0, Math.min(100, (avgAccuracy * 0.75) + (speedScore * 0.25)));

      localStorage.setItem('rapid_naming_score', finalScore.toFixed(2));
      sessionStorage.setItem('attention_score', finalScore.toFixed(2));
      sessionStorage.setItem('rapid_naming_accuracy', avgAccuracy.toFixed(2));
      sessionStorage.setItem('rapid_naming_seconds', totalTime.toFixed(2));

      document.getElementById('roundInfo').textContent = `Completed • Total Time: ${formatTime(totalTime)}`;
      document.getElementById('result').innerHTML = `
        <div class="alert alert-success">
          <strong>Total Time:</strong> ${totalTime.toFixed(2)} sec<br>
          <strong>Average Accuracy:</strong> ${avgAccuracy.toFixed(2)}%<br>
          <strong>Items per Minute:</strong> ${itemsPerMinute.toFixed(2)}<br>
          <strong>Rapid Naming Score:</strong> ${finalScore.toFixed(2)} / 100
        </div>`;
      document.getElementById('finishTestBtn').style.display = 'block';
    }

    document.getElementById('startBtn').textContent = 'Start Level';
    document.getElementById('submitBtn').textContent = 'Submit Level';
    document.getElementById('answer').disabled = true;

    document.getElementById('startBtn').addEventListener('click', startLevel);
    document.getElementById('submitBtn').addEventListener('click', scoreCurrentLevel);
    document.getElementById('finishTestBtn').addEventListener('click', () => {
      window.location.href = '/dyslexia-prediction';
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();

      const startBtn = document.getElementById('startBtn');
      const submitBtn = document.getElementById('submitBtn');
      const finishBtn = document.getElementById('finishTestBtn');

      if (finishBtn.style.display !== 'none') { finishBtn.click(); return; }
      if (!submitBtn.disabled && submitBtn.style.display !== 'none') { submitBtn.click(); return; }
      if (!startBtn.disabled) { startBtn.click(); }
    });

    document.getElementById('viewer').innerHTML = 'Press <strong>Start Level</strong> to begin Level 1.';
  </script>
</body>
</html>
